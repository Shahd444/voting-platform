# LAN mode (REAL_IP_CONF=real-ip.lan.conf): phones reach nginx only through
# scripts/lan-gateway.mjs on this computer, which puts the phone's address in
# X-Forwarded-For. Docker Desktop shows that hop as a private Docker address, so
# the header is trusted from those addresses only. This is safe only together
# with HTTP_BIND=127.0.0.1, which keeps nginx unreachable from the network.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.65.0/24;
real_ip_header X-Forwarded-For;
