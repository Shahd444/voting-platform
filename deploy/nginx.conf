# Reverse proxy / load balancer in front of the stateless app replicas.
# Docker's embedded DNS resolves "app" to every replica; nginx re-resolves
# it so scaled-out replicas join automatically.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream mc_app {
    zone mc_app 64k;
    server app:3000 resolve max_fails=1 fail_timeout=5s;
    keepalive 64;
}

# Coarse flood protection only. Keep it generous: every phone on the venue
# Wi-Fi shares ONE public IP (NAT). Fine-grained per-phone limits live in the app.
limit_req_zone $binary_remote_addr zone=api:10m rate=300r/s;

# Preserve TLS established by a trusted front proxy (including the LAN gateway),
# and otherwise use nginx's own connection scheme.
map $http_x_forwarded_proto $mc_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml text/csv;
gzip_min_length 1024;

server {
    listen 80;
    server_name _;
    client_max_body_size 4m;

    # --- TLS: terminate HTTPS here (or at your cloud load balancer). ---
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
    proxy_set_header X-Forwarded-Proto $mc_forwarded_proto;
    proxy_set_header X-Event-LAN-Networks $http_x_event_lan_networks;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_connect_timeout 2s;
    proxy_next_upstream_timeout 6s;
    proxy_next_upstream_tries 3;

    # Live results stream (SSE): no buffering, long-lived
    location /api/display/stream {
        proxy_pass http://mc_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        limit_req zone=api burst=600 nodelay;
        proxy_pass http://mc_app;
    }

    # Exhibitor images are immutable — let nginx/CDN cache them
    location /img/ {
        proxy_pass http://mc_app;
        expires 30d;
    }

    location / {
        proxy_pass http://mc_app;
    }
}
